        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0514;
            background-image: radial-gradient(circle at 50% 0%, #2a164d 0%, #0b0514 60%);
            color: white;
            min-height: 100vh;
        }
        
        /* Glowing border animation for profile */
        .profile-glow {
            background: linear-gradient(45deg, #ff5e00, #ff00b3, #7b00ff, #ff5e00);
            background-size: 400% 400%;
            animation: gradientBorder 5s ease infinite;
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Pulse animation for CTA button */
        .btn-glow {
            box-shadow: 0 0 25px rgba(255, 94, 0, 0.4);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 40px rgba(255, 94, 0, 0.7);
            transform: translateY(-2px) scale(1.02);
        }

        /* WhatsApp pulse animation */
        .whatsapp-glow {
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
        }
        .whatsapp-glow:hover {
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.7);
            transform: translateY(-2px) scale(1.02);
        }

        /* Stats card styling */
        .glass-card {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

    <!-- Countdown Timer Script -->
    <script>
        // 5 minute timer script
        let timeInSecs = 5 * 60; // 5 minutes
        const timerElement = document.getElementById('timer');

        function updateTimer() {
            let minutes = Math.floor(timeInSecs / 60);
            let seconds = timeInSecs % 60;

            // Zero padding if less than 10
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerElement.textContent = `${minutes}:${seconds}`;

            if (timeInSecs > 0) {
                timeInSecs--;
            } else {
                // Agar timer khatam ho jaye toh phir se 5 min pe reset kardo (FOMO create karne ke liye)
                timeInSecs = 5 * 60;
            }
        }

        // Har ek second me timer update karein
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
