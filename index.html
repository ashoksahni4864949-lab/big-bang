<!DOCTYPE html>

    <meta charset="UTF-8">

    <!-- Tailwind CSS import -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts import -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Custom styling for extra effects -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0514;
            background-image: radial-gradient(circle at 50% 0%, #2a164d 0%, #0b0514 60%);
            color: white;
            min-height: 100vh;
        }

        /* Pulse animation for CTA button */
        .btn-glow {
            box-shadow: 0 0 25px rgba(255, 94, 0, 0.4);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 40px rgba(255, 94, 0, 0.7);
            transform: translateY(-2px) scale(1.02);
        }

        /* WhatsApp pulse animation */
        .whatsapp-glow {
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
        }
        .whatsapp-glow:hover {
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.7);
            transform: translateY(-2px) scale(1.02);
        }

        /* Stats card styling */
        .glass-card {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom glow for the offer text */
        .offer-glow {
            box-shadow: 0 0 15px rgba(255, 94, 0, 0.3);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(255, 94, 0, 0.3); }
            50% { box-shadow: 0 0 25px rgba(255, 94, 0, 0.6); }
            100% { box-shadow: 0 0 15px rgba(255, 94, 0, 0.3); }
        }

        /* Premium Bonus Card Styles */
        .bonus-card {
            background: linear-gradient(to bottom, #153c23, #07190c);
            border-radius: 12px;
            border: 1px solid #285e3a;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .bonus-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .gold-text {
            background: linear-gradient(180deg, #FFF9D2 0%, #FFD700 40%, #D4AF37 70%, #8B6508 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-filter {
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.8));
        }
    </style>

        <p class="text-[10px] sm:text-xs text-[#a78bfa] tracking-[0.25em] mb-6 font-semibold uppercase text-center">Instant ID • Fast Withdrawals</p>

        <!-- Premium Bonus Banner -->
        <div class="w-full flex justify-center mb-6">
            <div class="w-full bonus-card flex items-center justify-between px-5 py-2 relative cursor-pointer hover:scale-[1.02] transition-transform duration-300">

        <!-- Stats Grid (3 Columns) -->

            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center gap-2 transition hover:bg-[#2a1a4a]">

                    <p class="text-[9px] text-gray-400 uppercase tracking-widest mt-1">Withdrawal</p>
                </div>
            </div>

            <!-- Box 2 -->
            <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center gap-2 transition hover:bg-[#2a1a4a]">
                <!-- Users Icon -->
                <svg class="w-6 h-6 text-[#ff5e00]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                <svg class="w-6 h-6 text-[#ff5e00]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        <!-- Trust Badges Footer -->
        <div class="flex items-center justify-center gap-4 text-xs font-semibold text-gray-400">

                <svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                Verified

            <span>•</span>
            <div class="flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                Secure
            </div>
            <span>•</span>
            <div class="flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                Instant
            </div>

    </div>

    <!-- Countdown Timer Script -->
    <script>
        // 5 minute timer script
        let timeInSecs = 5 * 60; // 5 minutes
        const timerElement = document.getElementById('timer');

        function updateTimer() {
            let minutes = Math.floor(timeInSecs / 60);
            let seconds = timeInSecs % 60;

            // Zero padding if less than 10
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            if (timerElement) {
                timerElement.textContent = `${minutes}:${seconds}`;
            }

            if (timeInSecs > 0) {
                timeInSecs--;
            } else {
                // Agar timer khatam ho jaye toh phir se 5 min pe reset kardo (FOMO create karne ke liye)
                timeInSecs = 5 * 60;
            }
        }

        // Har ek second me timer update karein
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
