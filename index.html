<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Bang - Premium ID</title>
    <!-- Tailwind CSS import -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts import -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Custom styling for extra effects -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f0f2f5;
            background-image: radial-gradient(circle at 50% 10%, #ffffff 0%, #d1d5db 100%);
            color: #111;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Stadium Lights Effect */
        .stadium-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image:
                radial-gradient(circle at 15% 30%, rgba(255,255,255,0.8) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(255,255,255,0.8) 0%, transparent 40%);
            opacity: 0.7;
        }

        /* Premium Pill shapes (Green with Gold Border) */
        .gradient-border-pill {
            position: relative;
            background: linear-gradient(to bottom, #0f3d24, #051c0e);
            border-radius: 999px;
            z-index: 1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .gradient-border-pill::before {
            content: ""; position: absolute; inset: -2.5px; border-radius: 999px;
            background: linear-gradient(180deg, #FFF9D2, #FFD700, #8B6508);
            z-index: -1;
        }

        /* Gold text gradient */
        .gold-text {
            background: linear-gradient(180deg, #FFF9D2 0%, #FFD700 40%, #D4AF37 70%, #8B6508 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-filter {
            filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.6));
        }

        /* Typography matching the image */
        .text-cricket {
            font-size: 4.5rem;
            line-height: 0.85;
            font-weight: 900;
            font-style: italic;
            color: #050505;
            transform: skewX(-8deg);
            letter-spacing: -1px;
        }
        @media (min-width: 400px) { .text-cricket { font-size: 5.5rem; } }

        .text-id-avail {
            font-size: 2.8rem;
            line-height: 0.9;
            font-weight: 900;
            font-style: italic;
            color: #0b361e;
            transform: skewX(-8deg);
        }
        @media (min-width: 400px) { .text-id-avail { font-size: 3.5rem; } }

        /* Super Highlighted CTA Animation */
        .cta-highlight {
            animation: superPulse 1.5s infinite ease-in-out;
        }
        @keyframes superPulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
            50% { transform: scale(1.04); box-shadow: 0 0 30px rgba(255, 215, 0, 0.9), 0 0 20px rgba(37, 211, 102, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        }
    </style>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)

        <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1780666083102012&ev=PageView&noscript=1" alt=""/>

    <!-- End Meta Pixel Code -->
</head>
<body class="flex flex-col items-center justify-center py-8 px-4 relative">

    <!-- Stadium Background Overlay -->
    <div class="stadium-bg"></div>

    <!-- Main Container -->
    <div class="max-w-[480px] w-full flex flex-col items-center relative z-10">

        <!-- Logo Section -->
        <div class="relative mb-6 flex justify-center w-full">
            <img src="your-logo.png" alt="Big Bang Logo" class="max-h-36 sm:max-h-44 w-auto object-contain drop-shadow-2xl">
        </div>

        <!-- Subheading (TRUSTED • FAST • ALWAYS) -->
        <div class="flex items-center justify-center gap-3 mb-2 w-full">
            <div class="h-[2px] w-10 bg-gradient-to-l from-[#B8860B] to-transparent"></div>
            <div class="text-[11px] sm:text-xs font-black tracking-widest text-[#111] italic uppercase">Trusted • Fast • Always</div>
            <div class="h-[2px] w-10 bg-gradient-to-r from-[#B8860B] to-transparent"></div>
        </div>

        <!-- Main Title -->
        <div class="flex flex-col items-center mb-8 w-full">
            <h1 class="text-cricket">CRICKET</h1>
            <h2 class="text-id-avail drop-shadow-md">!D AVAILABLE</h2>
        </div>

        <!-- Premium Bonus Banner -->
        <div class="w-full flex justify-center mb-8 px-2">
            <div class="w-full gradient-border-pill flex items-center justify-between px-6 py-3 relative cursor-pointer hover:scale-[1.02] transition-transform duration-300">
                <!-- Inner Glow -->
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-[#32854e] rounded-full blur-[20px] opacity-40 z-0"></div>

                <!-- GET -->
                <div class="text-white font-black italic text-2xl sm:text-3xl tracking-wider z-10">GET</div>

                <!-- Separator -->
                <div class="w-[2px] h-12 bg-gradient-to-b from-transparent via-[#ffd700] to-transparent transform -skew-x-[15deg] opacity-70 z-10 mx-2"></div>

                <!-- 10% -->
                <div class="z-10 gold-filter pb-1">
                    <div class="font-black italic text-[4rem] sm:text-[4.5rem] leading-none tracking-tighter gold-text relative">
                        10%
                    </div>
                </div>

                <!-- Separator -->
                <div class="w-[2px] h-12 bg-gradient-to-b from-transparent via-[#ffd700] to-transparent transform -skew-x-[15deg] opacity-70 z-10 mx-2"></div>

                <!-- WELCOME -->
                <div class="text-white font-black italic text-2xl sm:text-3xl tracking-wider z-10">WELCOME</div>
            </div>
        </div>

        <!-- Highly Highlighted CTA Button (WhatsApp) -->

            <!-- WhatsApp Icon with White Circle background -->
            <div class="bg-white rounded-full p-1 shadow-[0_0_10px_rgba(37,211,102,0.8)] z-10">
                <svg class="w-7 h-7 text-[#25D366]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                </svg>
            </div>
            <span class="text-white font-black text-xl sm:text-2xl italic tracking-wider z-10 drop-shadow-md">WHATSAPP NOW</span>
            <span class="text-yellow-400 font-bold text-2xl sm:text-3xl ml-1 z-10 drop-shadow-md">></span>
        </a>

        <!-- Footer Stats Grid -->
        <div class="grid grid-cols-3 gap-2 w-full pt-6 border-t-2 border-gray-300 border-opacity-60">
            <!-- SECURE ACCESS -->
            <div class="flex flex-col sm:flex-row items-center gap-2 text-center sm:text-left">
                <!-- Padlock Icon -->
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-[#111]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <div class="flex flex-col">
                    <span class="text-[10px] sm:text-[11px] font-black text-[#111] leading-tight">SECURE ACCESS</span>
                    <span class="text-[8px] sm:text-[9px] text-gray-600 font-medium leading-tight mt-0.5">Your safety is<br>our priority</span>
                </div>
            </div>

            <!-- FAST VERIFICATION -->
            <div class="flex flex-col sm:flex-row items-center gap-2 text-center sm:text-left border-l-2 border-r-2 border-gray-300 border-opacity-60 px-1">
                <!-- Stopwatch Icon -->
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-[#111]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div class="flex flex-col">
                    <span class="text-[10px] sm:text-[11px] font-black text-[#111] leading-tight">FAST VERIFICATION</span>
                    <span class="text-[8px] sm:text-[9px] text-gray-600 font-medium leading-tight mt-0.5">Quick & easy<br>verification</span>
                </div>
            </div>

            <!-- 24/7 SUPPORT -->
            <div class="flex flex-col sm:flex-row items-center gap-2 text-center sm:text-left">
                <!-- Headset Icon -->
                <svg class="w-8 h-8 sm:w-10 sm:h-10 text-[#111]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <div class="flex flex-col">
                    <span class="text-[10px] sm:text-[11px] font-black text-[#111] leading-tight">24/7 SUPPORT</span>
                    <span class="text-[8px] sm:text-[9px] text-gray-600 font-medium leading-tight mt-0.5">We are always<br>here for you</span>
                </div>
            </div>
        </div>

    </div>
